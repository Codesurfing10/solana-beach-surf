<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061820">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SB Surf">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Today's local surf briefing from live NWS and NOAA data.">
  <title>SB Surf</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">SB Surf</p>
    <h1 id="place">Today's surf</h1>
    <p id="loc-note" class="note">Uses your location for today's local surf. Your phone will ask for location. If you say no, this shows Solana Beach, CA.</p>
    <button id="refresh" type="button">Use my location</button>
    <div id="cards"></div>
    <footer>
      <p>iPhone: tap Share, then Add to Home Screen. The icon is named SB Surf. Each open loads live data. Nothing here is saved from an earlier briefing.</p>
      <p id="sources"></p>
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
